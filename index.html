<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Online Quiz Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-box">
    <div class="card">
      <h2 style="text-align:center">Online Quiz Management System</h2>
      <p class="muted" style="text-align:center;margin-bottom:14px">Student → Login → Quiz → Result</p>

      <div class="tabs">
        <button class="tab active" data-form="studentLogin">Student Login</button>
        <button class="tab" data-form="studentRegister">Register</button>
        <button class="tab" data-form="adminLogin">Admin</button>
      </div>

      <form id="studentLogin">
        <label for="slUser">Username</label>
        <input type="text" id="slUser" autocomplete="username">
        <label for="slPass">Password</label>
        <input type="password" id="slPass" autocomplete="current-password">
        <button class="btn" type="submit">Login</button>
      </form>

      <form id="studentRegister" class="hidden">
        <label for="regName">Full Name</label>
        <input type="text" id="regName">
        <label for="regUser">Username</label>
        <input type="text" id="regUser" autocomplete="username">
        <label for="regPass">Password (min 4 characters)</label>
        <input type="password" id="regPass" autocomplete="new-password">
        <button class="btn" type="submit">Register</button>
      </form>

      <form id="adminLogin" class="hidden">
        <label for="alUser">Admin Username</label>
        <input type="text" id="alUser">
        <label for="alPass">Admin Password</label>
        <input type="password" id="alPass">
        <p class="muted" style="margin-top:6px">Demo credentials: admin / admin123</p>
        <button class="btn" type="submit">Admin Login</button>
      </form>

      <div id="msg" class="msg"></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
